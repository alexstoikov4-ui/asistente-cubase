name: Windows - pruebas y ejecutable

on:
  push:
    branches: ["claude/ai-audio-engineer-cubase-7ylyl2", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest pyinstaller

      - name: Pruebas automáticas en Windows
        run: python -m pytest -q

      - name: Comprobar captura de pantalla y detección de Cubase en Windows real
        run: |
          python -c "from aiengineer.screen.desktop import WindowsDesktop; d=WindowsDesktop(); img=d.screenshot(); print('captura', img.shape, 'ventana activa:', repr(d.foreground_title()))"
          python -m aiengineer --home "$env:RUNNER_TEMP\aie" status

      - name: Crear AIEngineer.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name AIEngineer
          --add-data "aiengineer/data;aiengineer/data" --collect-submodules numpy
          lanzador.py

      - name: Probar que el ejecutable arranca (consola)
        run: |
          pyinstaller --noconfirm --onefile --console --name AIEngineer-consola --add-data "aiengineer/data;aiengineer/data" --collect-submodules numpy lanzador.py
          .\dist\AIEngineer-consola.exe --home "$env:RUNNER_TEMP\aie2" status
          .\dist\AIEngineer-consola.exe --home "$env:RUNNER_TEMP\aie2" --project Prueba do "Compón un drop progressive house con una melodía emotiva" --yes

      - name: Preparar compilador de C++ (32 bits, para Cubase 5)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compilar y probar el plugin AIE Clip de 32 bits
        working-directory: plugins_vst/aieclip
        run: |
          New-Item -ItemType Directory -Force out32 | Out-Null
          cl /nologo /O2 /EHsc /MT /utf-8 /LD aieclip.cpp /Foout32\ /link /DEF:aieclip.def /OUT:out32\AIEClip.dll user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /EHsc /MT /utf-8 tests_gui.cpp /Foout32\ /Feout32\tests_gui.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out32\tests_gui.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /MT /utf-8 test_host.c /Foout32\ /Feout32\test_host.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Push-Location out32
          .\test_host.exe .\AIEClip.dll
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force ..\..\dist | Out-Null
          Copy-Item out32\AIEClip.dll ..\..\dist\AIEClip-32bits.dll

      - name: Compilar y probar el plugin AIE Scope de 32 bits
        working-directory: plugins_vst/aiescope
        run: |
          New-Item -ItemType Directory -Force out32 | Out-Null
          cl /nologo /O2 /EHsc /MT /utf-8 /LD aiescope.cpp /Foout32\ /link /DEF:aiescope.def /OUT:out32\AIEScope.dll user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /EHsc /MT /utf-8 tests_scope.cpp /Foout32\ /Feout32\tests_scope.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out32\tests_scope.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /MT /utf-8 test_scope_host.c /Foout32\ /Feout32\test_scope_host.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out32\test_scope_host.exe .\out32\AIEScope.dll
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item out32\AIEScope.dll ..\..\dist\AIEScope-32bits.dll

      - name: Compilar y probar el plugin AIE Imager de 32 bits
        working-directory: plugins_vst/aieimager
        run: |
          New-Item -ItemType Directory -Force out32 | Out-Null
          cl /nologo /O2 /EHsc /MT /utf-8 /LD aieimager.cpp /Foout32\ /link /DEF:aieimager.def /OUT:out32\AIEImager.dll user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /EHsc /MT /utf-8 tests_imager.cpp /Foout32\ /Feout32\tests_imager.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out32\tests_imager.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /MT /utf-8 test_imager_host.c /Foout32\ /Feout32\test_imager_host.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out32\test_imager_host.exe .\out32\AIEImager.dll
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item out32\AIEImager.dll ..\..\dist\AIEImager-32bits.dll

      - name: Compilar y probar el plugin AIE Exciter de 32 bits
        working-directory: plugins_vst/aieexciter
        run: |
          New-Item -ItemType Directory -Force out32 | Out-Null
          cl /nologo /O2 /EHsc /MT /utf-8 /LD aieexciter.cpp /Foout32\ /link /DEF:aieexciter.def /OUT:out32\AIEExciter.dll user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /EHsc /MT /utf-8 tests_exciter.cpp /Foout32\ /Feout32\tests_exciter.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out32\tests_exciter.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /MT /utf-8 test_exciter_host.c /Foout32\ /Feout32\test_exciter_host.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out32\test_exciter_host.exe .\out32\AIEExciter.dll
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item out32\AIEExciter.dll ..\..\dist\AIEExciter-32bits.dll

      - name: Preparar compilador de C++ (64 bits)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar y probar el plugin AIE Clip de 64 bits
        working-directory: plugins_vst/aieclip
        run: |
          New-Item -ItemType Directory -Force out64 | Out-Null
          cl /nologo /O2 /EHsc /MT /utf-8 /LD aieclip.cpp /Foout64\ /link /DEF:aieclip.def /OUT:out64\AIEClip.dll user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /EHsc /MT /utf-8 tests_gui.cpp /Foout64\ /Feout64\tests_gui.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out64\tests_gui.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /MT /utf-8 test_host.c /Foout64\ /Feout64\test_host.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Push-Location out64
          .\test_host.exe .\AIEClip.dll
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { exit 1 }
          Copy-Item out64\AIEClip.dll ..\..\dist\AIEClip-64bits.dll

      - name: Compilar y probar el plugin AIE Scope de 64 bits
        working-directory: plugins_vst/aiescope
        run: |
          New-Item -ItemType Directory -Force out64 | Out-Null
          cl /nologo /O2 /EHsc /MT /utf-8 /LD aiescope.cpp /Foout64\ /link /DEF:aiescope.def /OUT:out64\AIEScope.dll user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /EHsc /MT /utf-8 tests_scope.cpp /Foout64\ /Feout64\tests_scope.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out64\tests_scope.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /MT /utf-8 test_scope_host.c /Foout64\ /Feout64\test_scope_host.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out64\test_scope_host.exe .\out64\AIEScope.dll
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item out64\AIEScope.dll ..\..\dist\AIEScope-64bits.dll

      - name: Compilar y probar el plugin AIE Imager de 64 bits
        working-directory: plugins_vst/aieimager
        run: |
          New-Item -ItemType Directory -Force out64 | Out-Null
          cl /nologo /O2 /EHsc /MT /utf-8 /LD aieimager.cpp /Foout64\ /link /DEF:aieimager.def /OUT:out64\AIEImager.dll user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /EHsc /MT /utf-8 tests_imager.cpp /Foout64\ /Feout64\tests_imager.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out64\tests_imager.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /MT /utf-8 test_imager_host.c /Foout64\ /Feout64\test_imager_host.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out64\test_imager_host.exe .\out64\AIEImager.dll
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item out64\AIEImager.dll ..\..\dist\AIEImager-64bits.dll

      - name: Compilar y probar el plugin AIE Exciter de 64 bits
        working-directory: plugins_vst/aieexciter
        run: |
          New-Item -ItemType Directory -Force out64 | Out-Null
          cl /nologo /O2 /EHsc /MT /utf-8 /LD aieexciter.cpp /Foout64\ /link /DEF:aieexciter.def /OUT:out64\AIEExciter.dll user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /EHsc /MT /utf-8 tests_exciter.cpp /Foout64\ /Feout64\tests_exciter.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out64\tests_exciter.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /O2 /MT /utf-8 test_exciter_host.c /Foout64\ /Feout64\test_exciter_host.exe /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\out64\test_exciter_host.exe .\out64\AIEExciter.dll
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item out64\AIEExciter.dll ..\..\dist\AIEExciter-64bits.dll

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AIEngineer-windows
          path: |
            dist/AIEngineer.exe
            dist/AIEngineer-consola.exe
            dist/AIEClip-32bits.dll
            dist/AIEClip-64bits.dll
            dist/AIEScope-32bits.dll
            dist/AIEScope-64bits.dll
            dist/AIEImager-32bits.dll
            dist/AIEImager-64bits.dll
            dist/AIEExciter-32bits.dll
            dist/AIEExciter-64bits.dll
            plugins_vst/aieclip/out32/editor.bmp

      - name: Publicar en la página de descargas (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: version-de-prueba
          name: AI Audio Engineer (versión de prueba)
          prerelease: true
          make_latest: false
          body: |
            Descarga **AIEngineer.exe** y ábrelo con doble clic (no necesita instalar Python).
            Si Windows muestra "Windows protegió su PC": Más información → Ejecutar de todas formas.
            `AIEngineer-consola.exe` es la versión de línea de comandos (opcional).
            **AIEClip-32bits.dll**: plugin clipper VST para Cubase 5 de 32 bits (cópialo a la carpeta VSTPlugins
            de Cubase, renómbralo a AIEClip.dll y reinicia Cubase). `AIEClip-64bits.dll` es para DAWs de 64 bits.
            **AIEScope-32bits.dll**: onda en color por bandas (graves rojo, medios verde, agudos azul); se instala igual
            con el nombre AIEScope.dll.
            **AIEImager-32bits.dll**: imagen estéreo multibanda (4 bandas: Width 0-200 %, Stereoize, Solo, Mono);
            se instala igual con el nombre AIEImager.dll.
            **AIEExciter-32bits.dll**: excitador armónico multibanda (7 perfiles, Mid/Side, Transient/Sustain, Delta);
            se instala igual con el nombre AIEExciter.dll.
            Compilado automáticamente desde el commit ${{ github.sha }}.
          files: |
            dist/AIEngineer.exe
            dist/AIEngineer-consola.exe
            dist/AIEClip-32bits.dll
            dist/AIEClip-64bits.dll
            dist/AIEScope-32bits.dll
            dist/AIEScope-64bits.dll
            dist/AIEImager-32bits.dll
            dist/AIEImager-64bits.dll
            dist/AIEExciter-32bits.dll
            dist/AIEExciter-64bits.dll
